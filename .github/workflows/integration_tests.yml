name: Integration tests

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Run Monday morning at 3 o'clock
    #       ┌───────────── minute (0 - 59)
    #       │ ┌───────────── hour (0 - 23)
    #       │ │ ┌───────────── day of the month (1 - 31)
    #       │ │ │ ┌───────────── month (1 - 12)
    #       │ │ │ │ ┌───────────── day of the week (0 - 6)
    #       │ │ │ │ │
    #       │ │ │ │ │
    #       │ │ │ │ │
    - cron: 0 3 * * 1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      php: ${{ steps.php.outputs.version }}
      laravel: ${{ steps.laravel.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: php
        uses: WyriHaximus/github-action-composer-php-versions-in-range@2c7b893179642a867c8d5b0e1b1e6e2b4c371c49 # v2.2.0

      - id: laravel
        name: Read Laravel versions from composer.json
        run: |
          node <<'JS' >> "$GITHUB_OUTPUT"
          const fs = require('fs');

          const composer = JSON.parse(fs.readFileSync('composer.json', 'utf8'));
          const constraint = composer['require-dev']['laravel/framework'];
          const majors = [...constraint.matchAll(/\^(\d+)\.0/g)].map((match) => match[1]);
          const versions = [...new Set(majors)].map((major) => `^${major}.0`);

          console.log(`matrix=${JSON.stringify(versions)}`);
          JS

  integration:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.matrix.outputs.php) }}
        laravel: ${{ fromJSON(needs.matrix.outputs.laravel) }}
        exclude:
          - php: 8.2
            laravel: ^13.0
    name: P=${{ matrix.php }} L=${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSER_NO_INTERACTION: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          ini-file: development
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-${{ matrix.php }}-composer-

      - env:
          LARAVEL_VERSION: ${{ matrix.laravel }}
        run: composer update --prefer-dist --no-progress --with "illuminate/contracts:${LARAVEL_VERSION}" --with "illuminate/support:${LARAVEL_VERSION}" --with "laravel/framework:${LARAVEL_VERSION}"

      - name: Run integration tests
        id: run-tests
        # Laravel 12 session handlers lack PHP 8.6 compatibility fixes; see laravel/framework#61517.
        continue-on-error: ${{ matrix.php == '8.6' && matrix.laravel == '^12.0' }}
        env:
          LARAVEL_VERSION: ${{ matrix.laravel }}
        run: tests/integration-laravel.sh "${LARAVEL_VERSION}"

      - name: Report non-blocking test failure
        if: ${{ steps.run-tests.outcome == 'failure' && steps.run-tests.conclusion == 'success' }}
        run: |
          echo "::warning::Integration tests failed on PHP 8.6 + Laravel 12 (non-blocking). See the Run integration tests log."
          echo "Integration tests failed on PHP 8.6 + Laravel 12 (non-blocking). See the **Run integration tests** log." >> "$GITHUB_STEP_SUMMARY"

  integration-otel:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.matrix.outputs.php) }}
        laravel: ${{ fromJSON(needs.matrix.outputs.laravel) }}
        exclude:
          - php: 8.2
            laravel: ^13.0
    name: OTel P=${{ matrix.php }} L=${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSER_NO_INTERACTION: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          ini-file: development
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.php }}-composer-otel-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-${{ matrix.php }}-composer-

      - env:
          LARAVEL_VERSION: ${{ matrix.laravel }}
        run: composer update --prefer-dist --no-progress --with "illuminate/contracts:${LARAVEL_VERSION}" --with "illuminate/support:${LARAVEL_VERSION}" --with "laravel/framework:${LARAVEL_VERSION}"

      - name: Run OpenTelemetry integration tests
        id: run-tests
        # This also boots Laravel's default session stack; see laravel/framework#61517.
        continue-on-error: ${{ matrix.php == '8.6' && matrix.laravel == '^12.0' }}
        env:
          LARAVEL_VERSION: ${{ matrix.laravel }}
        run: tests/integration-otel/run.sh "${LARAVEL_VERSION}"

      - name: Report non-blocking test failure
        if: ${{ steps.run-tests.outcome == 'failure' && steps.run-tests.conclusion == 'success' }}
        run: |
          echo "::warning::OpenTelemetry integration tests failed on PHP 8.6 + Laravel 12 (non-blocking). See the Run OpenTelemetry integration tests log."
          echo "OpenTelemetry integration tests failed on PHP 8.6 + Laravel 12 (non-blocking). See the **Run OpenTelemetry integration tests** log." >> "$GITHUB_STEP_SUMMARY"
